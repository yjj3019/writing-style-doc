name: Validate writing skill
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate sources and run regression checks
        run: |
          python scripts/validate_repo.py --verify-history
          python -m unittest discover -s tests
      - name: Package versioned skill
        run: python scripts/package_skill.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: writing-style-doc-${{ github.sha }}-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
